name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Live end-to-end smoke against the sdk-ci tenant. Self-skips (exits 0)
      # when OC_BASE is unset, so forks without secrets stay green.
      - run: node tests/e2e.mjs
        env:
          OC_BASE: ${{ secrets.OC_BASE }}
          OC_BEARER: ${{ secrets.OC_BEARER }}
          OC_TENANT: ${{ secrets.OC_TENANT }}
          OC_NS: ts_ci_${{ github.run_id }}
